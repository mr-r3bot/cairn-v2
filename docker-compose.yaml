services:
  cairn-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-app
    container_name: cairn-server
    ports:
      - "8000:8000"
    volumes:
      - ./datas/cairn/:/root/.local/share/cairn/
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/projects', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    command: ["uv", "run", "cairn", "serve", "--host", "0.0.0.0", "--no-access-log"]
  cairn-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-app
    container_name: cairn-dispatcher
    volumes:
      # start.sh detects the daemon socket (rootless hosts differ) and pins
      # it here via .env; the dispatcher always sees /var/run/docker.sock
      - ${CAIRN_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ./dispatch.yaml:/cairn/dispatch.yaml
      # shared with cairn-server (./datas/cairn): evidence bundles, sandbox
      # scratch/hits, pinned checkouts — read by both containers
      - ./datas/cairn:/cairn-datas
    environment:
      # absolute HOST path of ./datas/cairn — the Docker daemon resolves
      # bind-mount sources, so the v2 sandbox needs the host view.
      # Set it in .env next to this file, e.g. CAIRN_HOST_DATA=/home/me/cairn/datas/cairn
      - CAIRN_HOST_DATA=${CAIRN_HOST_DATA:-}
    depends_on:
      cairn-server:
        condition: service_healthy
    restart: unless-stopped
    command: ["uv", "run", "cairn", "dispatch", "--config", "dispatch.yaml"]
